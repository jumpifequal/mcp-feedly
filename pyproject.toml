[project]
name = "feedly-mcp-server"
dynamic = ["version"]  # single source of truth: feedly_mcp/__init__.py
description = "MCP server for Feedly API integration (stdio or bearer-protected HTTP, self-renewing tokens)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
dependencies = [
    "mcp>=1.9.0,<2",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "feedly_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["feedly_mcp"]
