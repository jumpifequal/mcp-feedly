<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 470" width="480" height="470" role="img" aria-labelledby="t d">
  <title id="t">mcp-feedly</title>
  <desc id="d">A puffy green cloud containing a feed symbol, with the text mcp-feedly underneath.</desc>
  <defs>
    <linearGradient id="puff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4be07a"/>
      <stop offset="1" stop-color="#1d9a3d"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.35" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .word-a { fill: #2b3138; }
      .word-b { fill: #2bb24c; }
      @media (prefers-color-scheme: dark) { .word-a { fill: #e9edf1; } }
    </style>
  </defs>

  <!-- soft ground shadow -->
  <ellipse cx="240" cy="338" rx="128" ry="12" fill="#000" opacity="0.13"/>

  <!-- the puffly cloud: overlapping circles + a rounded base -->
  <g fill="url(#puff)">
    <circle cx="168" cy="236" r="72"/>
    <circle cx="238" cy="186" r="88"/>
    <circle cx="322" cy="228" r="74"/>
    <circle cx="356" cy="272" r="48"/>
    <circle cx="124" cy="272" r="48"/>
    <rect x="124" y="244" width="232" height="76" rx="38"/>
  </g>
  <!-- highlight -->
  <g fill="url(#shine)">
    <circle cx="238" cy="186" r="88"/>
    <circle cx="168" cy="236" r="72"/>
  </g>

  <!-- feed symbol -->
  <g fill="none" stroke="#fff" stroke-width="17" stroke-linecap="round">
    <path d="M196 218 A40 40 0 0 1 236 258"/>
    <path d="M196 180 A78 78 0 0 1 274 258"/>
  </g>
  <circle cx="196" cy="258" r="15" fill="#fff"/>

  <!-- name -->
  <text x="240" y="428" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="1"><tspan class="word-a">mcp-</tspan><tspan class="word-b">feedly</tspan></text>
</svg>
